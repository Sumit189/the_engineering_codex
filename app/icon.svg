<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codex-favicon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#8d4b00"/>
    </linearGradient>
  </defs>

  <!-- Codex spine — stacked pages, matching the header logo -->
  <rect x="3" y="4" width="26" height="24" rx="5" fill="url(#codex-favicon-grad)"/>
  <rect x="3" y="4" width="26" height="24" rx="5" fill="none"
    stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Three "page" lines, decreasing in length -->
  <line x1="8" y1="11" x2="24" y2="11"
    stroke="rgba(255,255,255,0.6)"  stroke-width="1.8" stroke-linecap="round"/>
  <line x1="8" y1="16" x2="20" y2="16"
    stroke="rgba(255,255,255,0.5)"  stroke-width="1.8" stroke-linecap="round"/>
  <line x1="8" y1="21" x2="17" y2="21"
    stroke="rgba(255,255,255,0.4)"  stroke-width="1.8" stroke-linecap="round"/>
</svg>
